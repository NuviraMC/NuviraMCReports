name: NuviraMCReports
version: "1.0.9.1"
main: dev.aevorinstudios.aevorinReports.bukkit.BukkitPlugin
api-version: "1.18"
folia-supported: true
authors: [Aevorin Studios]
description: A comprehensive reporting system for Minecraft servers
softdepend: [PlaceholderAPI]

commands:
  ar:
    description: Reload the NuviraMCReports configuration
    usage: /ar reload
    permission: nuviramcreports.reload
    permission-message: You don't have permission to reload the config!
    aliases: [nr]
  nuviramcreports:
    description: Reload the NuviraMCReports configuration
    usage: /nuviramcreports reload
    permission: nuviramcreports.reload
    permission-message: You don't have permission to reload the config!
    aliases: []
  report:
    description: Report a player for breaking the rules
    usage: |
      /report <player> - Opens the report GUI
      /report <player> <reason> - Directly submit a report
    permission: nuviramcreports.report
    permission-message: You don't have permission to use this command!

  reports:
    description: View and manage player reports
    usage: /reports
  viewreport:
    description: View detailed information about a specific report
    aliases: []
    hidden: true
  setreportstatus:
    description: Set the status of a report
    usage: /setreportstatus <id> to <status>
    permission: nuviramcreports.manage
    permission-message: You don't have permission to use this command!
    aliases: []
    hidden: true

permissions:
  nuviramcreports.report:
    description: Allows players to report others
    default: true
  nuviramcreports.use:
    description: Allows players to create reports
    default: true
  nuviramcreports.anonymous:
    description: Allows players to submit anonymous reports
    default: op
  nuviramcreports.manage:
    description: Allows staff to manage reports
    default: op
  nuviramcreports.notify:
    description: Receive notifications about new reports
    default: op
  nuviramcreports.debug:
    description: Allows access to debug commands and features
    default: op
  nuviramcreports.update:
    description: Receive notifications about plugin updates
    default: op
  nuviramcreports.admin:
    description: Full access to all plugin features
    default: op
    children:
      nuviramcreports.use: true
      nuviramcreports.anonymous: true
      nuviramcreports.manage: true
      nuviramcreports.notify: true
      nuviramcreports.debug: true
      nuviramcreports.update: true
