plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'dev.aevorinstudios'
version = '1.0.9.1'
description = 'A comprehensive reporting system for Minecraft servers'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url 'https://repo.thenextlvl.net/releases' }
    maven { url 'https://repo.extendedclip.com/releases' }
}

dependencies {
    // PlaceholderAPI
    compileOnly 'me.clip:placeholderapi:2.11.6'

    // Adventure API
    implementation 'net.kyori:adventure-api:4.14.0'
    implementation 'net.kyori:adventure-text-minimessage:4.14.0'

    // Paper API
    compileOnly 'io.papermc.paper:paper-api:1.19.4-R0.1-SNAPSHOT'



    // HikariCP (shaded)
    implementation 'org.bstats:bstats-bukkit:3.0.2'
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // MySQL Connector (optional runtime)
    compileOnly 'mysql:mysql-connector-java:8.0.33'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Gson (shaded)
    implementation 'com.google.code.gson:gson:2.10.1'

    // JDA (Discord API)
    // 5.4.0 fixes the null available_tags parsing crash on GUILD_CREATE for forum channels
    implementation ('net.dv8tion:JDA:5.4.0') {
        exclude group: 'opus-java' // Not needed for a bot that only sends messages/commands
    }
    // FastStats (shaded)
    implementation 'dev.faststats.metrics:bukkit:0.18.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(project.properties)
    }
}

jar {
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

shadowJar {
    relocate 'com.zaxxer.hikari', 'dev.aevorinstudios.nuviramcreports.libs.hikari'
    relocate 'com.google.gson', 'dev.aevorinstudios.nuviramcreports.libs.gson'
    relocate 'org.bstats', 'dev.aevorinstudios.nuviramcreports.libs.bstats'
    relocate 'net.dv8tion.jda', 'dev.aevorinstudios.nuviramcreports.libs.jda'
    relocate 'com.neovisionaries.ws', 'dev.aevorinstudios.nuviramcreports.libs.neovisionaries'
    relocate 'com.fasterxml.jackson', 'dev.aevorinstudios.nuviramcreports.libs.jackson'
    relocate 'org.apache.commons.collections4', 'dev.aevorinstudios.nuviramcreports.libs.collections4'
    relocate 'gnu.trove', 'dev.aevorinstudios.nuviramcreports.libs.trove'
    relocate 'okhttp3', 'dev.aevorinstudios.nuviramcreports.libs.okhttp3'
    relocate 'okio', 'dev.aevorinstudios.nuviramcreports.libs.okio'
    relocate 'dev.faststats', 'dev.aevorinstudios.nuviramcreports.libs.faststats'
}

// Make shadowJar the default jar artifact
jar.enabled = false
build.dependsOn shadowJar
artifacts.archives shadowJar
